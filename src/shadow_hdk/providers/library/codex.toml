# Codex CLI, over its line-delimited JSON exec mode.
#
# **Measured signed-in**, 2026-09-11/12, `codex-cli 0.154.0`, on the owner's ChatGPT login (the
# harness read nothing of it — `codex login status` said `Logged in using ChatGPT`, and that line is
# the whole of what it saw). What a turn looks like, verbatim shapes:
#
#   {"type":"thread.started","thread_id":"…"}
#   {"type":"turn.started"}
#   {"type":"item.completed","item":{"id":"item_0","type":"agent_message","text":"…"}}
#   {"type":"item.started",  "item":{"id":"item_1","type":"command_execution","command":"…",
#                                    "aggregated_output":"","exit_code":null,"status":"in_progress"}}
#   {"type":"item.completed","item":{"id":"item_1","type":"command_execution",…,"exit_code":0}}
#   {"type":"turn.completed","usage":{"input_tokens":32154,"cached_input_tokens":26112,
#                                     "cache_write_input_tokens":0,"output_tokens":182,
#                                     "reasoning_output_tokens":51}}
#
# So: every item arrives as `item.completed` and the **sub-type** says what it is — the assistant's
# words are `agent_message` items only. The turn ends on `turn.completed`, which carries usage and
# no text (the final text is what was said). There is no price in the stream: a subscription turn is
# unpriced, and `cost_usd_at` is left blank so the meter says *unknown* rather than zero. Tools go in
# as repeated `-c mcp_servers.<name>.<field>=<toml>` overrides (`-c` takes a dotted TOML override).
# Native world tools are disabled when the kit injects tools (Phase 67, 2026-10-13).
# The read-only OS sandbox remains a second boundary; kit components are judged by the host.
# Under `exec`, injected tools need approval unless the server is pre-permitted —
# measured — unless the server is pre-permitted: `default_tools_approval_mode = "approve"` (the
# accepted values are `auto`, `prompt`, `writes`, `approve`; the CLI names them itself when handed
# any other). That is `allow_override` below, the same argument as Claude Code's `--allowedTools`.
#
# **A strict mode, found 2026-10-03 (H23, ENH-005 closed).** This record used to say Codex had no
# flag that stops the user's own configured MCP servers joining a run, and that it needed one
# upstream. It has one, on this very version:
#
#   --ignore-user-config    Do not load `$CODEX_HOME/config.toml`; auth still uses `CODEX_HOME`
#
# Two properties make it the right flag rather than a blunt one. Our own servers go in as `-c`
# command-line overrides rather than config, so they survive it — without that a governed run would
# have no tools at all, which is BUG-226's outcome by another route. And **auth still uses
# `CODEX_HOME`**, so a subscription login survives it; `CODEX_HOME` is in `backfill_env` already.
# Verified by parsing on the installed CLI, with `--no-such-flag-at-all` as the control so that
# acceptance means something. It is `mcp_strict_args` below, the same seam as Claude Code's
# `--strict-mcp-config`, and it is applied only when tools are injected — a launch governing nothing
# has no business dropping a person's configuration.
#
# One consequence to know: the flag drops the *whole* user config, not only its servers. A run whose
# mode names no `model` therefore gets the CLI's built-in default rather than the person's configured
# one. For a governed run that is the right way round — the mode decides, or nothing does — but it is
# a change, and `-m` is how a mode says otherwise (`behaviour_args` below).
#
# Governed startup also ignores rules, disables automatic repository documents and launches
# in a private directory. Disabling shell alone does not stop native image/browser/agent tools
# or project skill discovery. Exact SDK catalogue and actual MCP invocation are release gates.
# Older CLIs rejecting one of these explicit options fail visibly; there is no permissive retry.
# Uninjected CLI use retains its normal tools and directory. This is tool governance, not a claim
# of process confinement or deletion of the CLI's authentication/session storage.
#
# A failed turn, measured (the owner's free-tier limit, hit by these very measurements):
#
#   {"type":"error","message":"You've hit your usage limit. …"}
#   {"type":"turn.failed","error":{"message":"You've hit your usage limit. …"}}
#
# so a turn ends on `turn.completed` *or* `turn.failed`, `failed_at = "error"` is true on the
# latter, and `failed_text_at` puts the reason where the person reads it.
#
# **Still transcribed** (from the Codex docs and nexu-io/open-design's `codex.ts`), because three
# signed-in turns with `show_raw_agent_reasoning=true` and `model_reasoning_summary="detailed"`
# produced none: a `reasoning` item's shape (`item.type == "reasoning"`, `item.text`).
# `reasoning_output_tokens` was 51 on a turn that showed no reasoning item, so the tokens are spent
# and the text is withheld by the CLI in this mode. **The registry relay is proven end to end**
# (2026-09-18, Codex CLI 0.154.0, Phase 36): Codex proposed a plan through this run's `compose`
# component over the socket and both of the plan's `read_file` steps ran through our registry —
# `tests/test_a_cli_plans_through_the_socket.py`, `uv run pytest -m live -rs` on a signed-in
# machine. Earlier it had only called an injected stdio server's tools (including a destructive
# one, once pre-permitted); the quota had run out one turn short of the relay proof.
#
# What else is transcribed:
#   - `CODEX_HOME` must be named explicitly; the collector refuses a home-directory fallback so it
#     can never attribute one install's sessions to another
#   - a turn is one process, threaded to the last by `exec resume <id>`

id = "codex"
name = "Codex CLI"
kind = "agent"

bin = "codex"
bin_env_key = "CODEX_BIN"

version_probe = ["--version"]
auth_probe = ["login", "status"]
auth_failure_patterns = ["not logged in", "please run .*login", "no credentials", "unauthorized"]

transport = "jsonl"
launch_args = ["exec", "--json", "--skip-git-repo-check", "--sandbox", "read-only"]

injects_tools = "mcp"

strip_env = ["CODEX", "CODEX_PID"]
backfill_env = ["HOME", "PATH", "SHELL", "LANG", "TERM", "USER", "LOGNAME", "CODEX_HOME"]

install_hint = "npm i -g @openai/codex, then `codex login` to attach your subscription"

[dialect]
resident = false
prompt_shape = "text"
resume_args = ["exec", "resume"]
session_id_at = "thread_id"
subtype_key = "item.type"
say_on = ["item.completed/agent_message"]
say_at = "item.text"
think_on = ["item.completed/reasoning"]
think_at = "item.text"
done_on = ["turn.completed", "turn.failed"]
done_at = ""
failed_at = "error"
failed_text_at = "error.message"
cost_usd_at = ""
input_tokens_at = "usage.input_tokens"
output_tokens_at = "usage.output_tokens"
# What the cache did (D141), from the same `turn.completed` line measured above: the bulk of a
# subscription turn's input is a cache read, and `input_tokens` counts it in — so a product that
# wants the fresh part subtracts.
cache_read_tokens_at = "usage.cached_input_tokens"
cache_write_tokens_at = "usage.cache_write_input_tokens"
# The session is gone (D139). Measured 2026-09-20 on codex-cli 0.154.0 with `exec resume
# <unknown> --json`: nothing on stdout at all, and on stderr
#   Error: thread/resume: thread/resume failed: no rollout found for thread id <id> (code -32600)
# — which the session reads off stderr (it drains the pipe; BUG-059).
session_gone_matches = ["no rollout found for thread id"]

mcp_config_arg = "-c"
mcp_config_shape = "overrides"
allow_override = 'mcp_servers.{name}.default_tools_approval_mode="approve"'
private_working_directory = true
mcp_strict_args = ["--ignore-user-config", "--ignore-rules", "-c", "web_search=\"disabled\"", "-c", "project_doc_max_bytes=0", "--enable", "skip_host_skill_discovery", "--disable", "shell_tool", "--disable", "unified_exec", "--disable", "view_image", "--disable", "browser_use", "--disable", "browser_use_external", "--disable", "browser_use_full_cdp_access", "--disable", "computer_use", "--disable", "code_mode_host", "--disable", "apps", "--disable", "plugins", "--disable", "multi_agent", "--disable", "multi_agent_v2", "--disable", "memories", "--disable", "skill_search", "--disable", "skill_mcp_dependency_install", "--disable", "workspace_dependencies", "--disable", "hooks", "--disable", "sleep_tool", "--disable", "tool_suggest", "--disable", "shell_snapshot"]
disallow_arg = ""
disallow = []

# `codex exec` has no system-prompt flag, so a mode's instructions are handed to it in the turn
# instead (Epic 0011 Q1) — framed, and on the first turn only, since the CLI's own resume carries
# them after that. Before this they were named on `unmapped_behaviour` and then dropped, which meant
# a product's role reached Claude Code and not Codex.
instructions_in_prompt = true

# A mode's behaviour becomes these flags (D64, ENH-028), measured 2026-09-20 from
# `codex exec --help` on codex-cli 0.154.0: `-m, --model <MODEL>` is a flag of its own; reasoning
# effort is a config override — `-c model_reasoning_effort="<low|medium|high>"` — so its mapping
# carries a `template` saying how the value is spelled after `-c`. `temperature` still has no way
# in and is still named on the thread's `unmapped_behaviour`: a turn's text cannot set one.
[[dialect.behaviour_args]]
field = "model"
flag = "-m"

[[dialect.behaviour_args]]
field = "effort"
flag = "-c"
template = 'model_reasoning_effort="{value}"'

# Bundled metadata is local and deterministic; cache refresh and personal config are excluded.
[dialect.launch_catalogue]
probe_args = ["debug", "models", "--bundled"]
entries_at = "models"
config_arg = "-c"
config_template = 'model_catalog_json="{path}"'
isolated_env_keys = ["CODEX_HOME"]

[[dialect.launch_catalogue.replace_fields]]
name = "apply_patch_tool_type"

[[dialect.launch_catalogue.replace_fields]]
name = "supports_search_tool"
value = false

# Code-mode-only models need direct governed tools, not a disabled SDK REPL.
[[dialect.launch_catalogue.replace_fields]]
name = "tool_mode"
value = "direct"
require_present = false

[[dialect.launch_catalogue.replace_fields]]
name = "use_responses_lite"
value = false

[[dialect.launch_catalogue.replace_fields]]
name = "node_repl_disabled"
value = true

[[dialect.launch_catalogue.replace_fields]]
name = "experimental_supported_tools"
value = []

[[dialect.launch_catalogue.replace_fields]]
name = "multi_agent_version"
require_present = false

[capabilities]
tool_path = "controlled"
session = "resumable"
interrupt = "terminate"
streaming = "live"
reasoning = "unknown"
usage_tokens = "yes"
usage_cost = "no"

[[capabilities.evidence]]
axis = "tool_path"
kind = "measured"
source = "Codex 0.154.0: native world tools disabled, private bootstrap excludes repository discovery; actual local Responses catalogue and MCP read on the kit act record, including resume (Phase 67)"
at = "2026-10-13"

[[capabilities.evidence]]
axis = "session"
kind = "measured"
source = "thread_id resumed with exec resume"
at = "2026-09-12"

[[capabilities.evidence]]
axis = "interrupt"
kind = "derived"
source = "non-resident turn process can be terminated; no native interrupt is exposed"
at = "2026-09-12"

[[capabilities.evidence]]
axis = "streaming"
kind = "measured"
source = "JSONL items arrive before turn.completed"
at = "2026-09-12"

[[capabilities.evidence]]
axis = "reasoning"
kind = "measured"
source = "reasoning tokens observed but no reasoning item after three configured turns"
at = "2026-09-12"

[[capabilities.evidence]]
axis = "usage_tokens"
kind = "measured"
source = "turn.completed usage input_tokens and output_tokens"
at = "2026-09-12"

[[capabilities.evidence]]
axis = "usage_cost"
kind = "measured"
source = "subscription JSONL stream carries no price"
at = "2026-09-12"
