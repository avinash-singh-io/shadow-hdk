name: ci
on:
  # Every branch, not only the two nothing has landed on yet (TD-009). This lane has built
  # eighteen phases on a linear stack of phase branches, and CI has never run on one of them —
  # so the four zeros in every commit message are this machine's word and nothing else's.
  push:
  pull_request:
  workflow_dispatch:
jobs:
  check:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: astral-sh/setup-uv@v6
        with:
          python-version: "3.12"
      - run: uv sync --all-packages
      - run: uv run ruff check
      - run: uv run ruff format --check
      - run: uv run mypy
      - name: tests, with the runtime's coverage floor
        run: >
          uv run pytest -q
          --cov=shadow_hdk.runtime --cov-report=term-missing --cov-fail-under=90
      - name: the latency budget, printed
        run: uv run pytest tests/runtime/test_benchmark.py -q -s
