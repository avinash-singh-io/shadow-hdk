name: ci
on:
  push:
    branches: [main, staging]
  pull_request:
jobs:
  check:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: astral-sh/setup-uv@v6
        with:
          python-version: "3.12"
      - run: uv sync --all-packages
      - run: uv run ruff check
      - run: uv run ruff format --check
      - run: uv run mypy
      - name: tests, with the runtime's coverage floor
        run: >
          uv run pytest -q
          --cov=shadow_hdk.runtime --cov-report=term-missing --cov-fail-under=90
      - name: the latency budget, printed
        run: uv run pytest tests/runtime/test_benchmark.py -q -s
