name: helper wheels
# The Linux confinement helper's distribution (Epic 0010, D123 — `shadow-hdk-linux-sandbox`,
# bin-only, in lockstep with the kit), built the one way in the one place: glibc (manylinux 2.17 —
# every distribution since 2014) and musl (Alpine), x86_64 and aarch64, in maturin's manylinux
# containers with their cross toolchains, plus the sdist for an architecture nobody built for (it
# needs cargo). `bindings = "bin"` tags the wheels `py3-none-<platform>`: no Python-version
# coupling, which is what D123 declined. Called by `ci` on every push — so a release never finds
# out the matrix broke — and by `publish`, which uploads what this produced.
on:
  workflow_call:

jobs:
  wheel:
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        include:
          - target: x86_64
            libc: manylinux_2_17
          - target: aarch64
            libc: manylinux_2_17
          - target: x86_64
            libc: musllinux_1_2
          - target: aarch64
            libc: musllinux_1_2
    # **Reproducible on purpose** (TD-016). This wheel *is* the confinement mechanism, and a binary
    # nobody can rebuild and compare is a binary taken on trust. Two settings do the work:
    # `SOURCE_DATE_EPOCH` fixes the zip's timestamps (otherwise every build differs by the clock),
    # and `--remap-path-prefix` keeps the runner's absolute build directory out of the binary.
    # `codegen-units=1` removes the last source of ordering noise, at some build time.
    #
    # Found the hard way: re-running the publish for an already-released 0.35.0 reported
    # `Local file and index file do not match … Local: sha256=f5feb9d1…, Remote: sha256=ce9cc713…`
    # for the same commit, same container.
    env:
      SOURCE_DATE_EPOCH: "1700000000"
      RUSTFLAGS: "--remap-path-prefix=/home/runner/work/shadow-hdk/shadow-hdk=/src -C codegen-units=1"
    steps:
      - uses: actions/checkout@v4
      - uses: PyO3/maturin-action@v1
        with:
          working-directory: native/sandbox
          target: ${{ matrix.target }}
          manylinux: ${{ matrix.libc }}
          command: build
          args: --release --out dist
      - name: one wheel, tagged for the platform and no Python version
        run: |
          ls native/sandbox/dist
          ls native/sandbox/dist/*.whl | wc -l | grep -qx 1
          ls native/sandbox/dist/*.whl | grep -q "py3-none-${{ matrix.libc }}_${{ matrix.target }}"
      - uses: actions/upload-artifact@v4
        with:
          name: helper-${{ matrix.target }}-${{ matrix.libc }}
          path: native/sandbox/dist/*.whl

  # The claim above, checked rather than asserted: build the same commit twice and compare. One
  # target is enough to catch non-determinism — it is a property of the toolchain and the flags,
  # not of the architecture — and one is what the build time is worth.
  reproducible:
    runs-on: ubuntu-latest
    env:
      SOURCE_DATE_EPOCH: "1700000000"
      RUSTFLAGS: "--remap-path-prefix=/home/runner/work/shadow-hdk/shadow-hdk=/src -C codegen-units=1"
    steps:
      - uses: actions/checkout@v4
      - uses: PyO3/maturin-action@v1
        with:
          working-directory: native/sandbox
          target: x86_64
          manylinux: manylinux_2_17
          command: build
          args: --release --out first
      - uses: PyO3/maturin-action@v1
        with:
          working-directory: native/sandbox
          target: x86_64
          manylinux: manylinux_2_17
          command: build
          args: --release --out second
      - name: the same commit twice is the same bytes
        run: |
          one=$(sha256sum native/sandbox/first/*.whl | cut -d' ' -f1)
          two=$(sha256sum native/sandbox/second/*.whl | cut -d' ' -f1)
          echo "first  $one"
          echo "second $two"
          if [ "$one" != "$two" ]; then
            echo "::error::the helper's wheel is not reproducible — the same commit built twice"
            echo "::error::gave different bytes, so nobody can check a published wheel against"
            echo "::error::its source. This wheel is the confinement mechanism (TD-016)."
            exit 1
          fi

  sdist:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: PyO3/maturin-action@v1
        with:
          working-directory: native/sandbox
          command: sdist
          args: --out dist
      - uses: actions/upload-artifact@v4
        with:
          name: helper-sdist
          path: native/sandbox/dist/*.tar.gz

  # The x86_64 glibc wheel installed into a fresh venv on this runner is the helper the kit
  # finds beside the interpreter: `--probe` answers, and the same binary confines for real
  # (the crate's own tests cover the kernel; this covers the wheel).
  installed:
    needs: wheel
    runs-on: ubuntu-latest
    steps:
      - uses: actions/download-artifact@v4
        with:
          name: helper-x86_64-manylinux_2_17
          path: dist/
      - uses: astral-sh/setup-uv@v6
        with:
          python-version: "3.12"
      - run: |
          uv venv fresh
          uv pip install --python fresh/bin/python dist/*.whl
          fresh/bin/shadow-hdk-linux-sandbox --probe
          mkdir root && fresh/bin/shadow-hdk-linux-sandbox --mode workspace-write --root "$PWD/root" -- sh -c 'echo fine > root/inside && ! (echo bad > outside) && echo confined'
          test -f root/inside && ! test -f outside
