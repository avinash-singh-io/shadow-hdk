[project]
name = "shadow-hdk-wire"
version = "0.25.3"
description = "The runtime, reachable from another process or another language."
readme = "README.md"
requires-python = ">=3.12"
license = "MIT"
license-files = ["LICENSE"]
dependencies = ["shadow-hdk-kernel==0.25.3", "shadow-hdk==0.25.3"]

[project.optional-dependencies]
serve = ["starlette>=0.37", "uvicorn>=0.30", "httpx>=0.27"]

[build-system]
requires = ["hatchling>=1.25"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/shadow_hdk"]
