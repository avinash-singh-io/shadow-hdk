[project]
name = "shadow-hdk"
version = "0.26.1"
description = "The shadow-hdk runtime: compositions compiled to graphs, every step governed, proposals to a sink."
readme = "README.md"
requires-python = ">=3.12"
license = "MIT"
license-files = ["LICENSE"]
classifiers = [
    "Development Status :: 4 - Beta",
    "Intended Audience :: Developers",
    "Programming Language :: Python :: 3",
    "Programming Language :: Python :: 3.12",
    "Programming Language :: Python :: 3.13",
    "Topic :: Software Development :: Libraries",
    "Typing :: Typed",
]
# The kernel, and the engine that executes what we compile (D12). Nothing else: a model client, an
# MCP server or a sandbox is an adapter's dependency, never the runtime's.
dependencies = ["shadow-hdk-kernel==0.26.1", "langgraph>=1.2,<2"]

[project.urls]
Homepage = "https://github.com/avinash-singh-io/shadow-hdk"
Repository = "https://github.com/avinash-singh-io/shadow-hdk"
Changelog = "https://github.com/avinash-singh-io/shadow-hdk/blob/main/specs/changelog/2026-09.md"
Issues = "https://github.com/avinash-singh-io/shadow-hdk/issues"

[build-system]
requires = ["hatchling>=1.25"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/shadow_hdk"]
