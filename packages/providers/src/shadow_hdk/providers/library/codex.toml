# Codex CLI, over its line-delimited JSON exec mode.
#
# **Partly measured.** On 2026-09-11 `@openai/codex` 0.154.0 was installed *locally* (into a scratch
# directory, never globally — the harness detects and reports, it does not install; D41) and read
# off, signed out. What that run settled, against a real binary:
#
#   - `codex --version` prints `codex-cli 0.154.0`; the version probe reads it
#   - `codex login status` prints `Not logged in` and exits 1 when signed out; `detect()` reports
#     `not-signed-in` with that line as the message, through `CODEX_BIN` (which `detect()` did not
#     honour until this measurement — it does now)
#   - `codex exec --json --skip-git-repo-check` reads the prompt from stdin, and its first two lines
#     are `{"type":"thread.started","thread_id":"…"}` and `{"type":"turn.started"}` — so
#     `session_id_at` is right — before it fails `401 Unauthorized` on `wss://api.openai.com`
#   - tools are configured with `-c mcp_servers.<name>…` (`-c` takes a dotted TOML override)
#
# **Still transcribed**, because every one of them needs a signed-in Codex, which is a person's
# OpenAI login and not this lane's to hold: the shape of `item.completed`, where the final text
# and the usage live, and what `error` looks like mid-turn. They are copied from the reference
# implementation's own provider definition (nexu-io/open-design,
# `apps/daemon/src/runtimes/defs/codex.ts`), which *is* measured evidence — by them, not by us.
# The first signed-in turn should correct whatever is wrong in the `[dialect]` block below, and the
# corrections belong in this file rather than in a code path.
#
# What else is transcribed:
#   - `CODEX_HOME` must be named explicitly; the collector refuses a home-directory fallback so it
#     can never attribute one install's sessions to another
#   - a turn is one process, threaded to the last by `exec resume <id>`

id = "codex"
name = "Codex CLI"
kind = "agent"

bin = "codex"
bin_env_key = "CODEX_BIN"

version_probe = ["--version"]
auth_probe = ["login", "status"]
auth_failure_patterns = ["not logged in", "please run .*login", "no credentials", "unauthorized"]

transport = "jsonl"
launch_args = ["exec", "--json", "--skip-git-repo-check"]

injects_tools = "mcp"

strip_env = ["CODEX", "CODEX_PID"]
backfill_env = ["HOME", "PATH", "SHELL", "LANG", "TERM", "USER", "LOGNAME", "CODEX_HOME"]

install_hint = "npm i -g @openai/codex, then `codex login` to attach your subscription"

# `session_id_at` is measured; the rest of this block is transcribed rather than observed — see
# the header.
[dialect]
resident = false
prompt_shape = "text"
resume_args = ["exec", "resume"]
session_id_at = "thread.started.thread_id"
say_on = ["item.completed", "agent_message"]
say_at = "item.text"
done_on = ["turn.completed", "task_complete"]
done_at = "item.text"
failed_at = "error"
cost_usd_at = "usage.total_cost_usd"
input_tokens_at = "usage.input_tokens"
output_tokens_at = "usage.output_tokens"

mcp_config_arg = "-c"
mcp_strict_args = []
disallow_arg = ""
disallow = []
