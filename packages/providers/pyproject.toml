[project]
name = "shadow-hdk-providers"
version = "0.26.0"
description = "Which model or agent this machine can reach — bring your own key, or your own subscription."
readme = "README.md"
requires-python = ">=3.12"
license = "MIT"
license-files = ["LICENSE"]
dependencies = ["shadow-hdk-kernel==0.26.0"]

[build-system]
requires = ["hatchling>=1.25"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/shadow_hdk"]
