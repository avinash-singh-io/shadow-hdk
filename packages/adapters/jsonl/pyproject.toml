[project]
name = "shadow-hdk-adapters-jsonl"
version = "0.25.1"
description = "A coding CLI that answers in line-delimited JSON, driven as a governed agent provider."
readme = "README.md"
requires-python = ">=3.12"
license = "MIT"
license-files = ["LICENSE"]
dependencies = ["shadow-hdk-kernel==0.25.1", "shadow-hdk==0.25.1"]

[project.entry-points."shadow_hdk.transports"]
jsonl = "shadow_hdk.adapters.jsonl.transport:open_agent"

[build-system]
requires = ["hatchling>=1.25"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/shadow_hdk"]
