[project]
name = "shadow-hdk-adapters-modes"
version = "0.24.0"
description = "Governance as data: a mode is a ceiling and an ask line."
readme = "README.md"
requires-python = ">=3.12"
license = "MIT"
license-files = ["LICENSE"]
dependencies = ["shadow-hdk-kernel==0.24.0", "shadow-hdk==0.24.0"]

[build-system]
requires = ["hatchling>=1.25"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/shadow_hdk"]
