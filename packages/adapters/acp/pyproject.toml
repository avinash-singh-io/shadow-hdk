[project]
name = "shadow-hdk-adapters-acp"
version = "0.26.1"
description = "Another agent — Codex, Claude Code, anything speaking Zed's Agent Client Protocol — driven as a governed component."
readme = "README.md"
requires-python = ">=3.12"
license = "MIT"
license-files = ["LICENSE"]
classifiers = [
    "Development Status :: 4 - Beta",
    "Intended Audience :: Developers",
    "Programming Language :: Python :: 3",
    "Programming Language :: Python :: 3.12",
    "Programming Language :: Python :: 3.13",
    "Topic :: Software Development :: Libraries",
    "Typing :: Typed",
]
dependencies = ["shadow-hdk-kernel==0.26.1", "shadow-hdk==0.26.1", "agent-client-protocol>=0.12,<1"]

[project.urls]
Homepage = "https://github.com/avinash-singh-io/shadow-hdk"
Repository = "https://github.com/avinash-singh-io/shadow-hdk"
Changelog = "https://github.com/avinash-singh-io/shadow-hdk/blob/main/specs/changelog/2026-09.md"
Issues = "https://github.com/avinash-singh-io/shadow-hdk/issues"

[project.entry-points."shadow_hdk.transports"]
acp = "shadow_hdk.adapters.acp.transport:open_agent"

[build-system]
requires = ["hatchling>=1.25"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/shadow_hdk"]
