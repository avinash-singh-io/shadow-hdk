[project]
name = "shadow-hdk-adapters-otel"
version = "0.17.0"
description = "The shape of a run as a trace, over the OpenTelemetry API alone."
readme = "README.md"
requires-python = ">=3.12"
license = "MIT"
license-files = ["LICENSE"]
dependencies = ["shadow-hdk-kernel==0.17.0", "opentelemetry-api>=1.44,<2"]

[build-system]
requires = ["hatchling>=1.25"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/shadow_hdk"]
