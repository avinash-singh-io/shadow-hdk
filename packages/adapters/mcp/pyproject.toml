[project]
name = "shadow-hdk-adapters-mcp"
version = "0.6.0"
description = "An MCP server's tools become components, with effect profiles derived from its annotations rather than trusted."
readme = "README.md"
requires-python = ">=3.12"
dependencies = ["shadow-hdk-kernel", "shadow-hdk", "mcp>=2.0,<3"]

[build-system]
requires = ["hatchling>=1.25"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/shadow_hdk"]
