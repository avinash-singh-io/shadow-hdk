[project]
name = "shadow-hdk-adapters-mcp"
version = "0.12.0"
description = "An MCP server's tools become components, with effect profiles derived from its annotations rather than trusted."
readme = "README.md"
requires-python = ">=3.12"
license = "MIT"
license-files = ["LICENSE"]
dependencies = ["shadow-hdk-kernel==0.12.0", "shadow-hdk==0.12.0", "mcp>=2.0,<3"]

[build-system]
requires = ["hatchling>=1.25"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/shadow_hdk"]
