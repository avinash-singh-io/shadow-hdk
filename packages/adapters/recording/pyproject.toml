[project]
name = "shadow-hdk-adapters-recording"
version = "0.24.0"
description = "The run's registry, offered to a child agent as an MCP server — so what it does is routed, and therefore recorded."
readme = "README.md"
requires-python = ">=3.12"
license = "MIT"
license-files = ["LICENSE"]
dependencies = ["shadow-hdk-kernel==0.24.0", "shadow-hdk==0.24.0", "mcp>=2.0,<3"]

[project.scripts]
shadow-hdk-registry = "shadow_hdk.adapters.recording.socket:relay"

[build-system]
requires = ["hatchling>=1.25"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/shadow_hdk"]
