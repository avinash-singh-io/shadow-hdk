[project]
name = "shadow-hdk-adapters-agent"
version = "0.25.1"
description = "The model-driven loop as a component, and agent architectures as data."
readme = "README.md"
requires-python = ">=3.12"
license = "MIT"
license-files = ["LICENSE"]
dependencies = ["shadow-hdk-kernel==0.25.1", "shadow-hdk==0.25.1"]

[build-system]
requires = ["hatchling>=1.25"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/shadow_hdk"]
