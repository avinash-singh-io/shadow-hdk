[project]
name = "shadow-hdk-adapters-sandbox-subprocess"
version = "0.6.0"
description = "Run code with a leash — a timeout, an output cap, and an honest account of what it is not."
readme = "README.md"
requires-python = ">=3.12"
license = "MIT"
license-files = ["LICENSE"]
dependencies = ["shadow-hdk-kernel", "shadow-hdk"]

[build-system]
requires = ["hatchling>=1.25"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/shadow_hdk"]
