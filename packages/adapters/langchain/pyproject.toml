[project]
name = "shadow-hdk-adapters-langchain"
version = "0.26.0"
description = "One ModelPort over every provider LangChain integrates — OpenAI-compatible, Anthropic, Ollama, HuggingFace and the rest."
readme = "README.md"
requires-python = ">=3.12"
license = "MIT"
license-files = ["LICENSE"]
# `init_chat_model` lives in `langchain`; the vendor packages are extras, so the base install pulls
# no provider SDK and a deployment carries only what it uses.
dependencies = ["shadow-hdk-kernel==0.26.0", "shadow-hdk==0.26.0", "langchain>=1.0,<2"]

[project.optional-dependencies]
openai = ["langchain-openai>=1.0"]
anthropic = ["langchain-anthropic>=1.0"]
ollama = ["langchain-ollama>=1.0"]
huggingface = ["langchain-huggingface>=0.3"]

[build-system]
requires = ["hatchling>=1.25"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/shadow_hdk"]
