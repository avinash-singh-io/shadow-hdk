[project]
name = "shadow-hdk-adapters-basic"
version = "0.2.0"
description = "The small real adapters every deployment has: allow-all governance, a stdout sink, a system clock, and Python callables as components."
readme = "README.md"
requires-python = ">=3.12"
dependencies = ["shadow-hdk-kernel", "shadow-hdk"]

[build-system]
requires = ["hatchling>=1.25"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/shadow_hdk"]
