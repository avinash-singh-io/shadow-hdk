[project]
name = "shadow-hdk-adapters-mqtt"
version = "0.8.0"
description = "MQTT topics as sensors, actuators and witnesses, over the device contract."
readme = "README.md"
requires-python = ">=3.12"
license = "MIT"
license-files = ["LICENSE"]
dependencies = ["shadow-hdk-kernel", "shadow-hdk", "paho-mqtt>=2.1,<3"]

[build-system]
requires = ["hatchling>=1.25"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/shadow_hdk"]
