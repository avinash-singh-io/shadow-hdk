[project]
name = "shadow-hdk-adapters-workspace"
version = "0.12.0"
description = "A filesystem the agent can write to, confined to a root it cannot leave."
readme = "README.md"
requires-python = ">=3.12"
license = "MIT"
license-files = ["LICENSE"]
dependencies = ["shadow-hdk-kernel==0.12.0", "shadow-hdk==0.12.0"]

[build-system]
requires = ["hatchling>=1.25"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/shadow_hdk"]
