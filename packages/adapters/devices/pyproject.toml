[project]
name = "shadow-hdk-adapters-devices"
version = "0.26.1"
description = "Sensors read the world, actuators write it, a witness reports it: one device contract, the fake first."
readme = "README.md"
requires-python = ">=3.12"
license = "MIT"
license-files = ["LICENSE"]
classifiers = [
    "Development Status :: 4 - Beta",
    "Intended Audience :: Developers",
    "Programming Language :: Python :: 3",
    "Programming Language :: Python :: 3.12",
    "Programming Language :: Python :: 3.13",
    "Topic :: Software Development :: Libraries",
    "Typing :: Typed",
]
dependencies = ["shadow-hdk-kernel==0.26.1", "shadow-hdk==0.26.1"]

[project.urls]
Homepage = "https://github.com/avinash-singh-io/shadow-hdk"
Repository = "https://github.com/avinash-singh-io/shadow-hdk"
Changelog = "https://github.com/avinash-singh-io/shadow-hdk/blob/main/specs/changelog/2026-09.md"
Issues = "https://github.com/avinash-singh-io/shadow-hdk/issues"

[build-system]
requires = ["hatchling>=1.25"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/shadow_hdk"]
