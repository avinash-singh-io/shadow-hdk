[project]
name = "shadow-hdk-adapters-devices"
version = "0.23.0"
description = "Sensors read the world, actuators write it, a witness reports it: one device contract, the fake first."
readme = "README.md"
requires-python = ">=3.12"
license = "MIT"
license-files = ["LICENSE"]
dependencies = ["shadow-hdk-kernel==0.23.0", "shadow-hdk==0.23.0"]

[build-system]
requires = ["hatchling>=1.25"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/shadow_hdk"]
