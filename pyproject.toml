# The workspace root. It is not a distribution — `package = false` — it exists so one `uv sync`
# installs every package under packages/ with one lockfile and one toolchain config.
#
# Distributions (10-the-roadmap §7d): `shadow-hdk-kernel` (here), `shadow-hdk` (the runtime,
# R3), `shadow-hdk-adapters-<x>` (R1 onward). One import name, `shadow_hdk`, as a PEP 420
# namespace package, so `shadow_hdk.kernel` and `shadow_hdk.runtime` can ship separately.
[project]
name = "shadow-hdk-workspace"
version = "0.0.0"
requires-python = ">=3.12"
license = "MIT"
license-files = ["LICENSE"]
dependencies = ["shadow-hdk-kernel", "shadow-hdk", "shadow-hdk-adapters-basic", "shadow-hdk-adapters-agent", "shadow-hdk-adapters-langchain[openai,huggingface]", "shadow-hdk-adapters-modes", "shadow-hdk-adapters-mcp", "shadow-hdk-adapters-workspace", "shadow-hdk-adapters-sandbox-subprocess", "shadow-hdk-adapters-acp", "shadow-hdk-adapters-recording", "shadow-hdk-wire[serve]", "shadow-hdk-adapters-contained", "shadow-hdk-adapters-derivation", "shadow-hdk-adapters-otel", "shadow-hdk-adapters-devices", "shadow-hdk-adapters-mqtt"]

[tool.uv]
package = false

[tool.uv.workspace]
# Adapters nest one level deeper (`packages/adapters/<name>/`), so a bare `packages/*` would match
# the container directory and fail the sync with "missing a pyproject.toml".
members = ["packages/kernel", "packages/runtime", "packages/wire", "packages/adapters/*"]

[tool.uv.sources]
shadow-hdk-kernel = { workspace = true }
shadow-hdk = { workspace = true }
shadow-hdk-adapters-basic = { workspace = true }
shadow-hdk-adapters-agent = { workspace = true }
shadow-hdk-adapters-langchain = { workspace = true }
shadow-hdk-adapters-modes = { workspace = true }
shadow-hdk-adapters-mcp = { workspace = true }
shadow-hdk-adapters-workspace = { workspace = true }
shadow-hdk-adapters-sandbox-subprocess = { workspace = true }
shadow-hdk-adapters-acp = { workspace = true }
shadow-hdk-adapters-recording = { workspace = true }
shadow-hdk-wire = { workspace = true }
shadow-hdk-adapters-contained = { workspace = true }
shadow-hdk-adapters-derivation = { workspace = true }
shadow-hdk-adapters-otel = { workspace = true }
shadow-hdk-adapters-devices = { workspace = true }
shadow-hdk-adapters-mqtt = { workspace = true }

[dependency-groups]
dev = [
    "pytest>=8.3",
    "pytest-asyncio>=0.24",
    "pytest-cov>=5.0",
    "hypothesis>=6.100",
    "ruff>=0.6",
    "mypy>=1.11",
    "agent-client-protocol>=0.12",
    "pytest-timeout>=2.3",
    # A checkpointer we do NOT ship, to prove the host can bring its own. Everything before
    # Phase 6 was proven against `InMemorySaver`, which is not durability.
    "langgraph-checkpoint-sqlite>=2.0",
    "amqtt>=0.12.0",
]

[tool.ruff]
line-length = 100
target-version = "py312"
src = ["packages/kernel/src", "packages/runtime/src", "packages/adapters/basic/src:packages/adapters/agent/src:packages/adapters/langchain/src:packages/adapters/modes/src:packages/adapters/mcp/src:packages/adapters/workspace/src:packages/adapters/sandbox_subprocess/src:packages/adapters/acp/src:packages/adapters/recording/src", "packages/wire/src", "packages/adapters/contained/src", "packages/adapters/derivation/src", "packages/adapters/otel/src", "packages/adapters/devices/src", "packages/adapters/mqtt/src", "tests"]
# Prose, not source. The specs carry illustrative Python in fenced blocks — ruff 0.16 formats those,
# and a design document is not the formatter's business. momentum's own scaffold is vendored.
extend-exclude = ["specs", ".claude", ".agent", ".githooks", ".momentum"]

[tool.ruff.lint]
select = ["E", "F", "I", "UP", "B", "SIM", "TID252"]

[tool.mypy]
python_version = "3.12"
strict = true
packages = ["shadow_hdk", "tests"]
mypy_path = "packages/kernel/src:packages/runtime/src:packages/adapters/basic/src:packages/adapters/agent/src:packages/adapters/langchain/src:packages/adapters/modes/src:packages/adapters/mcp/src:packages/adapters/workspace/src:packages/adapters/sandbox_subprocess/src:packages/adapters/acp/src:packages/adapters/recording/src:packages/adapters/otel/src:packages/adapters/devices/src:packages/adapters/mqtt/src"
namespace_packages = true
explicit_package_bases = true

[[tool.mypy.overrides]]
# The dev broker ships no type information; the adapter never imports it — only the suite does.
module = ["amqtt.*"]
ignore_missing_imports = true

[tool.pytest.ini_options]
testpaths = ["tests"]
xfail_strict = true
# Live-provider tests cost money, so they are deselected by default and opted into with
# `uv run pytest -m live`. A normal run — and CI — calls nobody.
addopts = "-m 'not live'"
# **No test may hang.** This suite drives subprocesses — MCP servers, sandboxes, ACP agents — and
# several of them exist to prove that something *stops*. A hang is a worse failure than a red test:
# it stalls CI and it teaches you to stop reading the output. Sixty seconds is far above anything
# healthy here (the whole suite runs in under twenty) and far below "nobody noticed".
timeout = 60
markers = ["live: calls a real provider; costs money; opt in with -m live"]
asyncio_mode = "auto"
asyncio_default_fixture_loop_scope = "function"
