# Shadow HDK — one distribution, one import name. What a consumer installs is `shadow-hdk`; what
# it imports is `shadow_hdk.<part>`; what it does not need it does not pay for — the specialised
# SDKs are extras, and every adapter that wants one imports it lazily and says which extra when it
# is missing. The layering — the kernel pure, the runtime importing no adapter, no adapter importing
# another, the wire and the providers importing no adapter — is a test (`tests/invariants`), not a
# packaging boundary (D78).
[project]
name = "shadow-hdk"
version = "0.27.2"
description = "Shadow HDK — a Harness Development Kit: an effect-governed agent runtime, its components, and the wire."
readme = "README.md"
requires-python = ">=3.12"
license = "MIT"
license-files = ["LICENSE"]
classifiers = [
    "Development Status :: 4 - Beta",
    "Intended Audience :: Developers",
    "Programming Language :: Python :: 3",
    "Programming Language :: Python :: 3.12",
    "Programming Language :: Python :: 3.13",
    "Topic :: Software Development :: Libraries",
    "Typing :: Typed",
]
dependencies = [
    "pydantic>=2.9",                      # the kernel's one dependency: the published contracts
    "langgraph>=1.2,<2",                  # the runtime: a composition compiles to a graph
    "mcp>=2.0,<3",                        # MCP servers as components; the registry offered as one
    "anyio>=4",                           # the wire, the recording server, the batteries
    "agent-client-protocol>=0.12,<1",     # the ACP transport — OpenCode, anything Zed-compatible
    "starlette>=0.37",                    # `shadow-hdk serve --http`: the loopback listener with SSE
    "uvicorn>=0.30",
    "httpx>=0.27",                        # a client of that listener, and the TypeScript proof's peer
    "langgraph-checkpoint-sqlite>=3.1",   # a parked run sleeps on disk by default (D80), not in memory
]

[project.optional-dependencies]
# Bring your own key: one ModelPort over every provider LangChain integrates.
langchain = ["langchain>=1.0,<2"]
openai = ["shadow-hdk[langchain]", "langchain-openai>=1.0"]
anthropic = ["shadow-hdk[langchain]", "langchain-anthropic>=1.0"]
ollama = ["shadow-hdk[langchain]", "langchain-ollama>=1.0"]
huggingface = ["shadow-hdk[langchain]", "langchain-huggingface>=0.3"]
# Devices over MQTT 3.1.1.
mqtt = ["paho-mqtt>=2.1,<3"]
# The event stream as an OpenTelemetry trace.
otel = ["opentelemetry-api>=1.44,<2"]
# An environment inside a box somebody else built (OpenSandbox; needs a server).
sandbox = ["opensandbox>=0.1.16,<0.2"]
# The light web-search battery's engine (wigolo is its own process, installed with npm).
search = ["ddgs>=9"]
# The record on Postgres: the store, the threads and the checkpointer over one url (D79).
postgres = ["psycopg[binary,pool]>=3.2", "langgraph-checkpoint-postgres>=3.0"]
# Everything.
all = ["shadow-hdk[openai,anthropic,ollama,huggingface,mqtt,otel,sandbox,search,postgres]"]

[project.scripts]
shadow-hdk = "shadow_hdk.serve.__main__:main"
shadow-hdk-registry = "shadow_hdk.adapters.recording.socket:relay"

# How the providers find the transports the shipped CLIs speak (D40): a provider file names one.
[project.entry-points."shadow_hdk.transports"]
jsonl = "shadow_hdk.adapters.jsonl.transport:open_agent"
acp = "shadow_hdk.adapters.acp.transport:open_agent"

[project.urls]
Homepage = "https://github.com/avinash-singh-io/shadow-hdk"
Repository = "https://github.com/avinash-singh-io/shadow-hdk"
Changelog = "https://github.com/avinash-singh-io/shadow-hdk/blob/main/specs/changelog/2026-09.md"
Issues = "https://github.com/avinash-singh-io/shadow-hdk/issues"

[build-system]
requires = ["hatchling>=1.25"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/shadow_hdk"]

[tool.hatch.build.targets.sdist]
# Declared, not inherited: the first build carried the TypeScript client's node_modules (2,273
# files) because a nested .gitignore was not honoured. The source, and what installs it.
only-include = ["src/shadow_hdk", "README.md", "LICENSE", "pyproject.toml"]

[dependency-groups]
dev = [
    "pytest>=8.3",
    "pytest-asyncio>=0.24",
    "pytest-cov>=5.0",
    "hypothesis>=6.100",
    "ruff>=0.6",
    "mypy>=1.11",
    "pytest-timeout>=2.3",
    "amqtt>=0.12.0",
    "twine>=6",
]

[tool.uv]
# The suite exercises every adapter, so a development sync installs every extra.
default-groups = ["dev"]

[tool.ruff]
line-length = 100
target-version = "py312"
src = ["src", "tests"]
# Prose, not source. The specs carry illustrative Python in fenced blocks — ruff 0.16 formats those,
# and a design document is not the formatter's business. momentum's own scaffold is vendored.
extend-exclude = ["specs", ".claude", ".agent", ".githooks", ".momentum"]

[tool.ruff.lint]
select = ["E", "F", "I", "UP", "B", "SIM", "TID252"]

[tool.mypy]
python_version = "3.12"
strict = true
packages = ["shadow_hdk", "tests", "examples"]
mypy_path = "src"
explicit_package_bases = true

[[tool.mypy.overrides]]
# The dev broker ships no type information; the adapter never imports it — only the suite does.
module = ["amqtt.*"]
ignore_missing_imports = true

[tool.pytest.ini_options]
testpaths = ["tests"]
xfail_strict = true
# Live-provider tests cost money, so they are deselected by default and opted into with
# `uv run pytest -m live`. A normal run — and CI — calls nobody.
addopts = "-m 'not live'"
# **No test may hang.** This suite drives subprocesses — MCP servers, sandboxes, ACP agents — and
# several of them exist to prove that something *stops*. A hang is a worse failure than a red test:
# it stalls CI and it teaches you to stop reading the output. Sixty seconds is far above anything
# healthy here (the whole suite runs in under twenty) and far below "nobody noticed".
timeout = 60
markers = ["live: calls a real provider; costs money; opt in with -m live"]
asyncio_mode = "auto"
asyncio_default_fixture_loop_scope = "function"
